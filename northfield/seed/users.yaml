# Northfield Manufacturing — people, and what each is entitled to do.
#
# Scopes are the source of truth for permission. Note what is absent as much as
# what is present: Priya (quality) cannot create purchase orders, and Alex
# (production planning) cannot either — which is what makes the scope-denial
# failure case a real permission boundary rather than a staged one.

- user_id: u-100
  name: Grace Okonkwo
  email: grace.okonkwo@northfield-mfg.example
  role: Director of Operations
  manager_id: null
  backup_approver_id: null
  scopes:
    - erp:part:read
    - erp:po:read
    - erp:production:read
    - mail:read
    - calendar:read
  approval_limits:
    po_create_max_value: 250000

- user_id: u-101
  name: Dana Whitfield
  email: dana.whitfield@northfield-mfg.example
