# Dana's and Priya's inboxes on 2026-09-02.
#
# The delay is stated in prose, in a human register, in the middle of a paragraph
# that also contains an apology and an unrelated offer. Extracting "2026-09-08"
# from it is the one part of this problem a model is genuinely better at than
# code — see the LLM boundary table in the README.

#
# Alex Mercer in production planning is copied, deliberately. He sees exactly what
# Dana sees, his agent runs the same detector over the same data and raises the same
# attention item — and the gate refuses his plan, because he does not hold
# erp:po:create. Seeing a problem and being allowed to fix it are different things,
# and the failure suite turns on that distinction.
- message_id: M-001
  direction: inbound
  from_addr: rita.alvarez@kestrelcomponents.example
  to_addrs:
    - dana.whitfield@northfield-mfg.example
    - alex.mercer@northfield-mfg.example
  date: '2026-09-01T16:42:00'
  subject: 'Re: PO-77812 shipment update'
  thread_id: T-77812
  body: |
    Dana,

    Apologies for the short notice. Our winding line went down on Friday and we
    are still working through the backlog, so PO-77812 will not make the 4th as
    promised. Revised ship date is Monday 9/7, which puts it on your dock Tuesday
    9/8. The full 400 units will ship together; we are not splitting the order.

    I know that is tight against your build schedule. If it helps, we can look at
    partial air freight for a portion of the quantity, though I would need to come
    back to you on cost.

    Rita Alvarez
    Kestrel Components

