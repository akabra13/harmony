# The production planner's agent.
#
# Alex sees exactly the same shortfall Dana does — same detector, same data, same
# attention item — and cannot do anything about it. His profile never asks for
# erp:po:create, and he does not hold it.
#
# This profile exists to make the scope-denial failure case a real permission
# boundary rather than a staged one: the run reaches the gate, the gate denies the
# plan whole, nothing is written, and the audit names the rule and the missing
# scope. See `make demo-failures`.
#
# The denial comes from the *workflow* binding below, not from the tool list. Alex
# may enter po_reroute — his agent quite reasonably concludes a reroute is the right
# answer — and the workflow's steps require erp:po:create, which he does not hold.
# Binding a workflow a profile cannot complete is left permitted on purpose: it is
# exactly the situation the brief describes, and refusing it at start-up would hide
# a real organisational fact behind a configuration error.

id: production_planner
name: Production Planner Agent
description: >
  Watches planned production for material risk. Can see problems; cannot buy the
  way out of them.

assigned_to:
  - u-303   # Alex Mercer

detectors:
  - material_shortfall

providers:
  - erp
  - mail
  - calendar

# Only what Alex actually holds the scopes for. Listing erp.create_purchase_order
# here would be decorative: the catalog filters what the planner is shown by scope
# (ToolCatalog.available_to), so an unscoped tool is never offered in the first
# place and start-up validation now rejects the inconsistency.
tools:
  - erp.list_approved_suppliers_for_part
  - erp.filter_suppliers_by_lead_time
  - schedule.*

workflows:
  - po_reroute

scopes:
  - erp:part:read
  - erp:po:read
  - erp:production:read
  - mail:read
  - calendar:read
  - harmony:schedule:create
